[project]
name = "opinion-watch"
version = "0.2.0"
description = "品牌舆情自动巡检与桌面播报应用"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "playwright>=1.55.0,<2.0.0",
    "keyring>=25.6.0,<26.0.0",
    "websockets>=14.2,<15.0",
    "tzdata>=2025.2,<2027.0",
]

[project.optional-dependencies]
desktop = [
    "pyside6>=6.8.0,<7.0.0",
    "qtawesome>=1.3.0,<2.0.0",
]

[project.scripts]
opinion-watch = "opinion_watch.cli:main"
opinion-watch-desktop = "opinion_watch.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-qt>=4.4.0,<5.0.0",
    "mypy>=1.15.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opinion_watch"]

[tool.pytest.ini_options]
addopts = "-q --cov=opinion_watch --cov-report=term-missing --cov-fail-under=35"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
