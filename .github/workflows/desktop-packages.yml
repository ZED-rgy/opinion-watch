name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install application dependencies
        run: uv sync --dev --extra desktop

      - name: Install PyInstaller
        run: uv pip install --python .venv pyinstaller==6.15.0

      - name: Build executable
        run: uv run python packaging/build.py

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/OpinionWatch -DestinationPath artifacts/OpinionWatch-windows.zip

      - name: Archive macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ -d "dist/OpinionWatch.app" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/OpinionWatch.app" "artifacts/OpinionWatch-macos.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/OpinionWatch" "artifacts/OpinionWatch-macos.zip"
          fi

      - name: Publish package to private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="build-${GITHUB_RUN_ID}"
          release_title="Desktop packages - ${GITHUB_RUN_ID}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$release_title" \
              --notes "Automated desktop build for ${GITHUB_SHA}."
          fi
          gh release upload "$release_tag" artifacts/*.zip --clobber
